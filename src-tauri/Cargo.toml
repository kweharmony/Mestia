[package]
name = "mestia"
version = "1.2.1"
description = "Mestia — загрузчик видео и медиатека"
authors = ["del"]
edition = "2021"

[workspace]
members = ["addon-workers"]
default-members = ["."]
resolver = "2"

# Имя библиотеки, которое вызывает main.rs (mestia_lib::run()).
[lib]
name = "mestia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP только для резолва метаданных Spotify/Apple Music (см. downloader::resolve_input).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Таймаут запросов метаданных yt-dlp, очередь строк вывода (уже в дереве через Tauri).
tokio = { version = "1", features = ["time", "sync", "net", "fs", "io-util", "macros", "rt"] }
libc = "0.2"

# На Android эти зависимости нужны локальному плееру. На Windows x64 серверы
# локальной сети поставляются отдельно.
[target.'cfg(not(all(windows, target_arch = "x86_64")))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[target.'cfg(not(any(target_os = "android", all(windows, target_arch = "x86_64"))))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "ws"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
socket2 = "0.6"
if-addrs = "0.13"

# Только компьютер: один экземпляр, sidecar-бинарники, самообновление, слежение за папкой, корзина.
# На Android yt-dlp/ffmpeg живут в Kotlin-плагине (см. engine.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
notify = "6"
# Удаление файлов/папок в системную корзину (безопасное, с возможностью восстановить).
trash = "5"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux", all(windows, not(target_arch = "x86_64"))))'.dependencies]
keepawake = "0.6.1"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
tokio = { version = "1", features = ["process"] }

[target.'cfg(target_os = "android")'.dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
