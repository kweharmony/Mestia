[package]
name = "mestia"
version = "1.1.1"
description = "Mestia — загрузчик видео и медиатека"
authors = ["del"]
edition = "2021"

# Имя библиотеки, которое вызывает main.rs (mestia_lib::run()).
[lib]
name = "mestia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP только для резолва метаданных Spotify/Apple Music (см. downloader::resolve_input).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Таймаут запросов метаданных yt-dlp, очередь строк вывода (уже в дереве через Tauri).
tokio = { version = "1", features = ["time", "sync", "net", "fs", "io-util", "macros", "rt"] }
# Локальная сеть (lan.rs): HTTP/WebSocket-сервер, клиент комнаты, UDP-обнаружение.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "ws", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
socket2 = "0.6"
if-addrs = "0.13"

# Только компьютер: sidecar-бинарники, самообновление, слежение за папкой, корзина.
# На Android yt-dlp/ffmpeg живут в Kotlin-плагине (см. engine.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
notify = "6"
# Удаление файлов/папок в системную корзину (безопасное, с возможностью восстановить).
trash = "5"
keepawake = "0.6.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
