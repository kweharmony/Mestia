<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Mestia promo</title>
<!--
  Промо-ролик Mestia (≈22 с, 1280×720). Кадр целиком задаётся функцией seek(t):
  никаких таймеров и requestAnimationFrame — render.mjs вызывает seek(i/30) и
  снимает скриншот, поэтому рендер детерминированный. ?lang=en — английские подписи,
  ?play — просто проиграть в браузере для предпросмотра.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet" />
<style>
  :root { --snow:#fbfbfb; --paper:#f2f2f2; --ink:#000; --accent:#1a1a1a; --fog:#dddddd; --smoke:#6b6b6b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: var(--snow); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .mark { color: var(--ink); }
  .word { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; }
  .tag { font-size: 20px; font-weight: 600; color: var(--smoke); letter-spacing: -0.01em; }
  .caps { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--smoke); }

  /* Окно приложения */
  #win { position: absolute; left: 140px; top: 70px; width: 1000px; height: 580px; border: 2px solid var(--ink); border-radius: 16px; background: var(--snow); overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.12); }
  #side { position: absolute; left: 0; top: 0; bottom: 0; width: 200px; background: var(--paper); padding: 20px 14px; }
  .nav { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--smoke); }
  .nav.on { background: var(--fog); color: var(--ink); }
  .nav svg { width: 17px; height: 17px; flex: none; }
  #main { position: absolute; left: 200px; right: 0; top: 0; bottom: 0; }

  .h { font-size: 34px; font-weight: 500; letter-spacing: -0.03em; text-align: center; }
  .field { width: 560px; height: 58px; border: 2px solid var(--fog); border-radius: 12px; display: flex; align-items: center; padding: 0 8px 0 20px; font-size: 17px; font-weight: 600; }
  .go { margin-left: auto; width: 42px; height: 42px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--ink); margin-left: 2px; vertical-align: middle; }

  .row { width: 460px; border: 2px solid var(--fog); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--snow); }
  .tile { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
  .bar { height: 5px; border-radius: 3px; background: var(--fog); overflow: hidden; margin-top: 8px; }
  .bar > b { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .toast { position: absolute; right: 96px; bottom: 28px; height: 50px; padding: 0 20px; border: 2px solid var(--ink); border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .circle { position: absolute; right: 28px; bottom: 28px; width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--ink); background: var(--snow); display: flex; align-items: center; justify-content: center; }
  .circle svg.ring { position: absolute; left: -9px; top: -9px; width: 64px; height: 64px; transform: rotate(-90deg); }

  .grid { position: absolute; left: 36px; right: 36px; top: 84px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { border: 2px solid var(--fog); border-radius: 12px; overflow: hidden; background: var(--snow); }
  .thumb { aspect-ratio: 16/9; }
  .card p { font-size: 13px; font-weight: 600; padding: 8px 10px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #player { position: absolute; inset: 0; background: #000; overflow: hidden; }
  #player .ov { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 22px 18px; background: linear-gradient(to top, rgba(0,0,0,.8), transparent); display: flex; align-items: center; gap: 14px; color: #fff; font-size: 13px; font-weight: 600; }
  .play { width: 46px; height: 46px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .seek { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .seek b { display: block; height: 100%; border-radius: 2px; background: #fff; }

  /* «Рядом» */
  #near { position: absolute; inset: 0; }
  .radar { position: absolute; left: 70px; top: 140px; width: 220px; height: 220px; }
  .radar .wave { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); }
  .radar .me { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 18px;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
  .radar .lbl { position: absolute; left: 0; right: 0; top: 240px; text-align: center; font-size: 13px; font-weight: 700; }
  .radar .sub { position: absolute; left: 0; right: 0; top: 260px; text-align: center; font-size: 12px; font-weight: 600; color: var(--smoke); }
  .peer { position: absolute; left: 360px; width: 380px; border: 2px solid var(--fog); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; background: var(--snow); }
  .peer .av { width: 42px; height: 42px; border-radius: 12px; background: var(--paper); display: flex; align-items: center; justify-content: center; flex: none; }
  .peer .nm { font-size: 14px; font-weight: 700; }
  .peer .st { font-size: 12px; font-weight: 600; color: var(--smoke); margin-top: 2px; }
  .peer .send { margin-left: auto; height: 32px; padding: 0 14px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; }
  .chip { position: absolute; height: 36px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--ink); background: var(--snow); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; box-shadow: 0 10px 24px rgba(0,0,0,.12); }
  .room { position: absolute; left: 360px; top: 330px; width: 380px; border: 2px solid var(--ink); border-radius: 14px; padding: 16px; background: var(--snow); }
  .faces { display: flex; }
  .faces b { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--snow); margin-left: -8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
  .faces b:first-child { margin-left: 0; }

  .appicon { width: 180px; height: 180px; border-radius: 40px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <!-- 1. Знак -->
  <div id="s1" class="center">
    <svg id="s1mark" class="mark" viewBox="0 0 256 256" width="150" height="150"></svg>
    <div id="s1word" class="word" style="margin-top:6px">Mestia</div>
    <div id="s1tag" class="tag" style="margin-top:10px" data-t="tag"></div>
  </div>

  <!-- 2–4. Окно приложения -->
  <div id="win">
    <div id="side">
      <div style="display:flex;align-items:center;gap:8px;margin:0 8px 22px">
        <span style="width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 256 256" width="22" height="22" style="color:#fff" class="m"></svg></span>
        <b style="font-size:17px;letter-spacing:-0.02em">Mestia</b>
      </div>
      <div class="nav" id="navDl"><i data-ico="dl"></i><span data-t="nDl"></span></div>
      <div class="nav" id="navLib"><i data-ico="lib"></i><span data-t="nLib"></span></div>
      <div class="nav" id="navHist"><i data-ico="hist"></i><span data-t="nHist"></span></div>
      <div class="nav" id="navNear"><i data-ico="near"></i><span data-t="nNear"></span></div>
    </div>
    <div id="main">
      <!-- Загрузчик -->
      <div id="dl" class="center" style="gap:26px">
        <div class="h" data-t="ask"></div>
        <div class="field"><span id="url"></span><span class="caret" id="caret"></span>
          <span class="go" id="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </div>
        <div class="row" id="row">
          <span class="tile" id="rtile"></span>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Lo-fi beats — live session</div>
            <div id="rstat" style="font-size:12px;font-weight:600;color:var(--smoke);margin-top:2px"></div>
            <div class="bar" id="rbarw"><b id="rbar"></b></div>
          </div>
        </div>
      </div>
      <div class="circle" id="circle">
        <svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="none" stroke="var(--fog)" stroke-width="3"/><circle id="ringp" cx="24" cy="24" r="22" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="138.2"/></svg>
        <span id="cicon"></span>
      </div>
      <div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span data-t="done"></span></div>

      <!-- Медиатека -->
      <div id="lib">
        <div class="caps" style="position:absolute;left:38px;top:40px" data-t="nLib"></div>
        <div class="grid" id="grid"></div>
      </div>

      <!-- Рядом: устройства в сети, передача файла, «Смотреть вместе» -->
      <div id="near">
        <div class="caps" style="position:absolute;left:38px;top:40px" data-t="nNear"></div>
        <div class="radar">
          <div class="wave" id="w0"></div><div class="wave" id="w1"></div><div class="wave" id="w2"></div>
          <div class="me"><i data-ico="laptop" style="display:flex"></i></div>
          <div class="lbl" data-t="thisDev"></div>
          <div class="sub" data-t="noNet"></div>
        </div>
        <div class="peer" id="peer0" style="top:110px">
          <span class="av"><i data-ico="phone" style="display:flex"></i></span>
          <div style="min-width:0;flex:1"><div class="nm">Pixel 8</div><div class="st" id="p0st"></div>
            <div class="bar" id="p0barw" style="margin-top:6px"><b id="p0bar"></b></div></div>
          <span class="send" id="p0send" data-t="send"></span>
        </div>
        <div class="peer" id="peer1" style="top:210px">
          <span class="av"><i data-ico="tablet" style="display:flex"></i></span>
          <div style="min-width:0;flex:1"><div class="nm">Galaxy Tab</div><div class="st" data-t="online"></div></div>
          <span class="send" data-t="send"></span>
        </div>
        <div class="chip" id="chip"><i data-ico="film" style="display:flex"></i>Lo-fi beats.mp4</div>
        <div class="room" id="room">
          <div style="display:flex;align-items:center;gap:10px">
            <i data-ico="tv" style="display:flex;color:var(--accent)"></i>
            <b style="font-size:14px" data-t="together"></b>
            <div class="faces" style="margin-left:auto">
              <b id="f0" style="background:#e07a5f">А</b><b id="f1" style="background:#3d85c6">M</b><b id="f2" style="background:#6aa84f">К</b>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;font-weight:600;color:var(--smoke)">
            <span>Lo-fi beats — live session</span><span style="margin-left:auto" data-t="synced"></span>
          </div>
          <div class="bar" style="margin-top:8px"><b id="roombar"></b></div>
        </div>
      </div>

      <!-- Плеер -->
      <div id="player">
        <div id="pimg" style="position:absolute;inset:0"></div>
        <!-- «Кадр»: мягкий силуэт гор поверх градиента -->
        <svg id="hills" viewBox="0 0 800 450" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
          <path d="M0 330 L150 190 Q170 172 190 190 L300 290 L420 150 Q440 128 462 150 L640 320 L800 230 L800 450 L0 450Z" fill="rgba(255,255,255,.22)"/>
          <path d="M0 390 L210 260 L330 340 L520 230 L800 380 L800 450 L0 450Z" fill="rgba(255,255,255,.18)"/>
          <circle id="sun" cx="610" cy="120" r="46" fill="rgba(255,255,255,.35)"/>
        </svg>
        <div style="position:absolute;left:22px;top:18px;color:#fff"><div style="font-size:15px;font-weight:600">Lo-fi beats — live session</div><div style="font-size:11px;opacity:.6;font-weight:600">YouTube</div></div>
        <div class="ov">
          <span class="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg></span>
          <span id="ptime">0:00</span><span class="seek"><b id="pseek"></b></span><span>3:42</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. Темы -->
  <div id="s5" class="center">
    <div class="appicon" id="ticon"><svg viewBox="0 0 256 256" width="148" height="148" style="color:#fff" class="m"></svg></div>
    <div id="tname" style="margin-top:28px;font-size:26px;font-weight:700;letter-spacing:-0.02em"></div>
    <div class="caps" style="margin-top:8px" data-t="themes"></div>
  </div>

  <!-- 6. Финал -->
  <div id="s6" class="center">
    <svg class="mark m" viewBox="0 0 256 256" width="110" height="110"></svg>
    <div class="word" style="font-size:56px">Mestia</div>
    <div class="tag" style="margin-top:14px">Windows · Linux · Android</div>
    <div style="margin-top:26px;padding:10px 18px;border:2px solid var(--ink);border-radius:12px;font-size:16px;font-weight:700">github.com/kweharmony/Mestia</div>
  </div>

<script>
// Знак Mestia (= LOGO_MARK в src/lib/appIcon.ts): две вершины и play в долине.
const PEAKS = "M35.9 189.1 L79.0 79.9 Q90.0 52.0 103.1 79.0 L118.4 110.2 Q128.0 130.0 141.9 112.9 L155.6 96.2 Q172.0 76.0 182.1 100.0 L219.8 189.3 Q226.0 204.0 210.0 204.0 L46.0 204.0 Q30.0 204.0 35.9 189.1 Z";
const PLAY = "M110.0 146.0 L110.0 178.0 Q110.0 186.0 116.9 182.0 L145.1 166.0 Q152.0 162.0 145.1 158.0 L116.9 142.0 Q110.0 138.0 110.0 146.0 Z";
const MARK = `<path fill="currentColor" fill-rule="evenodd" d="${PEAKS} ${PLAY}"/>`;
document.querySelectorAll(".m").forEach((e) => (e.innerHTML = MARK));
document.getElementById("s1mark").innerHTML =
  `<path id="pk" fill="currentColor" d="${PEAKS}"/><path id="pl" fill="var(--snow)" d="${PLAY}"/>`;

// Иконки lucide (как в приложении): тело <svg> без обёртки.
const ICO = {
  dl: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  lib: '<path d="M20 17a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.9a2 2 0 0 1-1.69-.9l-.81-1.2a2 2 0 0 0-1.67-.9H8a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2Z"/><path d="M2 8v11a2 2 0 0 0 2 2h14"/>',
  hist: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  near: '<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/>',
  laptop: '<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>',
  phone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
  tablet: '<rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
  film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/>',
  tv: '<rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><path d="m17 2-5 5-5-5"/>',
};
document.querySelectorAll("[data-ico]").forEach((el) => {
  const big = el.dataset.ico === "laptop";
  el.innerHTML = `<svg viewBox="0 0 24 24" width="${big ? 36 : 20}" height="${big ? 36 : 20}" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">${ICO[el.dataset.ico]}</svg>`;
});

const L = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ru";
const T = {
  ru: { tag: "Скачивай. Храни. Смотри.", nDl: "Загрузчик", nLib: "Медиатека", nHist: "История", nNear: "Рядом",
        ask: "Что будем скачивать?", dlg: "Скачивается",
        thisDev: "Этот компьютер", noNet: "Wi-Fi · без интернета", send: "Отправить", online: "В сети",
        recv: "Получает", got: "Получено", together: "Смотреть вместе", synced: "у всех одновременно", proc: "Обработка…", ok: "Готово", done: "Готово: Lo-fi beats", themes: "8 тем — и иконка под каждую" },
  en: { tag: "Download. Keep. Watch.", nDl: "Downloader", nLib: "Library", nHist: "History", nNear: "Nearby",
        ask: "What shall we download?", dlg: "Downloading",
        thisDev: "This computer", noNet: "Wi-Fi · no internet", send: "Send", online: "Online",
        recv: "Receiving", got: "Received", together: "Watch together", synced: "in sync for everyone", proc: "Processing…", ok: "Done", done: "Done: Lo-fi beats", themes: "8 themes — each with its own icon" },
}[L];
document.documentElement.lang = L;
document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = T[e.dataset.t]));

const THEMES = [
  ["Clean Mono", "#fbfbfb", "#000000", "#1a1a1a"],
  ["Sunset Lavender", "#f4f2f9", "#7d4c35", "#de8255"],
  ["Velvet Midnight", "#fdf1f2", "#200d20", "#ae445d"],
  ["Matcha Oasis", "#f6f3eb", "#2b4f4f", "#458282"],
  ["Midnight Indigo", "#191826", "#dbe1f2", "#5672af"],
  ["Deep Forest", "#141a13", "#d8e2d4", "#2a5747"],
];
const THUMBS = [
  ["#ff9a8b", "#ff6a88"], ["#a1c4fd", "#c2e9fb"], ["#84fab0", "#8fd3f4"],
  ["#fbc2eb", "#a6c1ee"], ["#fddb92", "#d1fdff"], ["#cfd9df", "#e2ebf0"],
];
const TITLES = ["Lo-fi beats — live session", "Как устроен двигатель", "Горы Сванетии 4K", "Подкаст #42", "Tame Impala — Live", "Лекция по физике"];
const grid = document.getElementById("grid");
THUMBS.forEach(([a, b], i) => {
  grid.insertAdjacentHTML("beforeend",
    `<div class="card" id="c${i}"><div class="thumb" style="background:linear-gradient(135deg,${a},${b})"></div><p>${TITLES[i]}</p></div>`);
});
document.getElementById("pimg").style.background = `linear-gradient(135deg,${THUMBS[0][0]},${THUMBS[0][1]})`;

const URL_TXT = "https://youtube.com/watch?v=lofi-session";
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const span = (t, a, b) => clamp((t - a) / (b - a));         // 0→1 на отрезке [a,b]
const ease = (x) => 1 - Math.pow(1 - x, 3);                  // easeOutCubic
const inout = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2); // лёгкий перелёт
const show = (el, o, y = 0, s = 1) => {
  el.style.opacity = o;
  el.style.transform = `translateY(${y}px) scale(${s})`;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
};
// Видимость сцены: вход за `fin` секунд, выход за `fout`.
const vis = (t, a, b, fin = 0.4, fout = 0.4) => Math.min(span(t, a, a + fin), 1 - span(t, b - fout, b));
const ICON = {
  spin: (p) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" style="transform:rotate(${p}deg)"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>`,
  check: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>`,
  arrow: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>`,
};

function seek(t) {
  // ── 1. Знак (0–2.6) ──
  const s1 = vis(t, 0, 2.6, 0.01, 0.45);
  show($("s1"), s1, (1 - s1) * -10);
  const mk = back(span(t, 0.1, 0.9));
  $("s1mark").style.transform = `scale(${0.55 + 0.45 * mk}) translateY(${(1 - ease(span(t, 0.1, 0.8))) * 30}px)`;
  $("s1mark").style.opacity = span(t, 0.1, 0.5);
  $("pl").style.transform = `scale(${ease(span(t, 0.7, 1.1))})`;
  $("pl").style.transformOrigin = "128px 162px";
  show($("s1word"), ease(span(t, 0.8, 1.3)), (1 - ease(span(t, 0.8, 1.3))) * 14);
  show($("s1tag"), ease(span(t, 1.2, 1.7)), (1 - ease(span(t, 1.2, 1.7))) * 10);

  // ── Окно (2.4–14.2) ──
  const w = vis(t, 2.4, 18.6, 0.5, 0.45);
  show($("win"), w, (1 - ease(span(t, 2.4, 2.9))) * 24, 0.97 + 0.03 * ease(span(t, 2.4, 2.9)));
  const tab = t >= 14.3 ? "Near" : t >= 10.1 ? "Lib" : "Dl";
  for (const n of ["Dl", "Lib", "Hist", "Near"]) $(`nav${n}`).className = "nav" + (n === tab ? " on" : "");

  // ── 2. Ссылка (2.9–6) ──
  const dl = vis(t, 2.6, 10.3, 0.3, 0.3);
  show($("dl"), dl);
  const typed = Math.round(URL_TXT.length * span(t, 3.1, 4.9));
  $("url").textContent = URL_TXT.slice(0, typed);
  $("caret").style.opacity = t < 5.3 && Math.floor(t * 2.2) % 2 === 0 ? 1 : 0;
  const press = span(t, 5.2, 5.35) - span(t, 5.35, 5.55);
  $("go").style.transform = `scale(${1 - 0.12 * press})`;

  // ── 3. Загрузка (5.5–10) ──
  const r = ease(span(t, 5.5, 5.95));
  show($("row"), r, (1 - r) * 12);
  const pct = 100 * inout(span(t, 6.0, 8.6));
  const proc = t >= 8.6 && t < 9.2, ok = t >= 9.2;
  $("rtile").style.background = ok ? "rgba(16,185,129,.14)" : "color-mix(in srgb, var(--accent) 12%, transparent)";
  $("rtile").innerHTML = ok ? ICON.check : ICON.spin(t * 360);
  $("rstat").textContent = ok ? T.ok : proc ? T.proc : `${T.dlg} · ${Math.round(pct)}%`;
  $("rstat").style.color = ok ? "#059669" : "";
  $("row").style.borderColor = ok ? "rgba(16,185,129,.4)" : "";
  $("rbarw").style.opacity = ok ? 0 : 1;
  $("rbar").style.width = pct + "%";
  const c = ease(span(t, 5.6, 6.0)) * (1 - span(t, 9.9, 10.2));
  show($("circle"), c, 0, 0.7 + 0.3 * c);
  $("ringp").style.strokeDashoffset = 138.2 * (1 - pct / 100);
  $("ringp").style.opacity = ok ? 0 : 1;
  $("cicon").innerHTML = ok ? ICON.check : ICON.arrow;
  const ts = ease(span(t, 9.25, 9.6)) * (1 - span(t, 10.0, 10.25));
  show($("toast"), ts, (1 - ts) * 30);

  // ── 4. Медиатека и плеер (10.2–14.2) ──
  const lib = vis(t, 10.2, 14.2, 0.25, 0.01) * (1 - span(t, 12.2, 12.5));
  show($("lib"), lib);
  for (let i = 0; i < 6; i++) {
    const p = ease(span(t, 10.35 + i * 0.12, 10.85 + i * 0.12));
    show($(`c${i}`), p, (1 - p) * 18, 0.96 + 0.04 * p);
  }
  $("c0").style.borderColor = t > 11.6 ? "var(--ink)" : "";
  const pl = ease(span(t, 12.2, 12.75)) * (1 - span(t, 14.2, 14.45));
  $("player").style.visibility = pl > 0 ? "visible" : "hidden";
  $("player").style.opacity = pl;
  $("player").style.clipPath = `inset(${(1 - pl) * 18}% ${(1 - pl) * 52}% ${(1 - pl) * 50}% ${(1 - pl) * 4}% round 12px)`;
  const ptime = Math.max(0, t - 12.6) * 9;
  $("ptime").textContent = `0:${String(Math.floor(ptime)).padStart(2, "0")}`;
  $("pseek").style.width = (ptime / 222) * 100 + "%";
  $("hills").style.transform = `scale(${1.08 - 0.08 * ease(span(t, 12.2, 14.2))})`;

  // ── «Рядом» (14.3–18.6): радар, устройства, файл летит на телефон, комната ──
  const nr = span(t, 14.3, 14.6);
  show($("near"), nr);
  for (let i = 0; i < 3; i++) {
    const ph = ((t - 14.3) / 1.8 + i / 3) % 1;
    $(`w${i}`).style.transform = `scale(${0.35 + 0.75 * ph})`;
    $(`w${i}`).style.opacity = t < 14.3 ? 0 : 0.55 * (1 - ph);
  }
  for (let i = 0; i < 2; i++) {
    const p = ease(span(t, 14.75 + i * 0.3, 15.2 + i * 0.3));
    show($(`peer${i}`), p, 0, 0.94 + 0.06 * p);
    $(`peer${i}`).style.transform += ` translateX(${(1 - p) * 30}px)`;
  }
  // нажали «Отправить» → файл летит от радара к Pixel 8
  const press2 = span(t, 15.45, 15.55) - span(t, 15.55, 15.7);
  $("p0send").style.transform = `scale(${1 - 0.1 * press2})`;
  const fly = inout(span(t, 15.6, 16.3));
  const fx = 140 + (520 - 140) * fly, fy = 240 + (128 - 240) * fly - Math.sin(fly * Math.PI) * 70;
  $("chip").style.left = fx + "px";
  $("chip").style.top = fy + "px";
  show($("chip"), Math.min(span(t, 15.6, 15.75), 1 - span(t, 16.2, 16.35)), 0, 1 - 0.3 * span(t, 16.15, 16.35));
  const rp = 100 * inout(span(t, 16.3, 17.0));
  const got = t >= 17.0;
  $("p0st").textContent = t < 16.3 ? T.online : got ? `✓ ${T.got}` : `${T.recv} · ${Math.round(rp)}%`;
  $("p0st").style.color = got ? "#059669" : "";
  $("p0barw").style.opacity = t >= 16.3 && !got ? 1 : 0;
  $("p0bar").style.width = rp + "%";
  $("p0send").style.opacity = t >= 16.3 ? 0 : 1;
  // «Смотреть вместе»: комната, лица по очереди, общий прогресс
  const rm = ease(span(t, 17.0, 17.4));
  show($("room"), rm, (1 - rm) * 16);
  for (let i = 0; i < 3; i++) {
    const f = back(span(t, 17.25 + i * 0.12, 17.6 + i * 0.12));
    $(`f${i}`).style.transform = `scale(${f})`;
  }
  $("roombar").style.width = 22 + 30 * span(t, 17.2, 18.6) + "%";

  // ── 5. Темы (18.6–21.1) ──
  const s5 = vis(t, 18.6, 21.1, 0.35, 0.35);
  show($("s5"), s5, 0, 0.96 + 0.04 * s5);
  const k = Math.min(THEMES.length - 1, Math.floor(span(t, 18.75, 20.9) * THEMES.length));
  const th = THEMES[k];
  const sceneTheme = t >= 18.6 && t < 21.1;
  document.body.style.background = sceneTheme ? th[1] : "var(--snow)";
  $("s5").style.color = th[2];
  $("ticon").style.background = th[3];
  $("tname").textContent = th[0];
  const local = span(t, 18.75, 20.9) * THEMES.length;
  const bump = 1 - span(local - Math.floor(local), 0, 0.35);
  $("ticon").style.transform = `scale(${1 + 0.04 * bump})`;

  // ── 6. Финал (21.0–22.4) ──
  const s6 = ease(span(t, 21.0, 21.5));
  show($("s6"), s6, (1 - s6) * 14);
}
window.seek = seek;
window.DURATION = 22.4;
seek(0);

// Предпросмотр в браузере: ?play
if (new URLSearchParams(location.search).has("play")) {
  const t0 = performance.now();
  const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
