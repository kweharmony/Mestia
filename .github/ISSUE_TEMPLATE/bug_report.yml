name: Ошибка · Bug report
description: Что-то работает не так · Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Уязвимости — не сюда, а по [SECURITY.md](../blob/main/SECURITY.md).
        Thanks for the report! Security issues go to [SECURITY.md](../blob/main/SECURITY.md), not here.
  - type: dropdown
    id: platform
    attributes:
      label: Платформа · Platform
      options:
        - Windows
        - Linux (.deb)
        - Linux (AppImage)
        - Linux / Steam Deck (Flatpak)
        - macOS
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Mestia · Mestia version
      description: Из имени установщика/APK или страницы релиза · From the installer/APK name or release page
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Ссылка, на которой воспроизводится · Example link
      description: Если ошибка при загрузке · If it's a download problem
  - type: textarea
    id: steps
    attributes:
      label: Шаги · Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали и что получили · Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Текст ошибки, скриншот · Error text, screenshot
      description: Можно вставить картинку · You can paste an image
