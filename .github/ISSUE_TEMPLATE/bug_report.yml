name: Bug report · Ошибка
description: Something doesn't work · Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security issues go to [SECURITY.md](../blob/main/SECURITY.md), not here.
        Спасибо за отчёт! Уязвимости — не сюда, а по [SECURITY.md](../blob/main/SECURITY.md).
  - type: dropdown
    id: platform
    attributes:
      label: Platform · Платформа
      options:
        - Windows
        - Linux (.deb)
        - Linux (AppImage)
        - Linux / Steam Deck (Flatpak)
        - macOS
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mestia version · Версия Mestia
      description: From the installer/APK name or release page · Из имени установщика/APK или страницы релиза
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Example link · Ссылка, на которой воспроизводится
      description: If it's a download problem · Если ошибка при загрузке
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Шаги
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual · Что ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error text, screenshot · Текст ошибки, скриншот
      description: You can paste an image · Можно вставить картинку
