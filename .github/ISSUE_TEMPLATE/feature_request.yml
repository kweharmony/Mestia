name: Feature request · Идея
description: Suggest an improvement · Предложить улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? · Какую задачу это решит?
      placeholder: It's frustrating when… · Мне неудобно, когда…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution · Как вы это видите
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms · Платформы
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - All · Все
  - type: textarea
    id: extra
    attributes:
      label: Additional context · Дополнительно
      description: Screenshots, examples from other apps · Скриншоты, примеры из других приложений
