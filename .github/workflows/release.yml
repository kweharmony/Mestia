name: release

# Сборка установщиков при пуше тега вида v1.2.3
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # macOS — единый universal-бинарник (Intel + Apple Silicon).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # flatpak/shared-modules — рецепт libappindicator для трея (нужен Linux-ноге).
          submodules: recursive

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      # Для universal-сборки нужны обе цели macOS.
      - name: Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Кэш Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      - name: Sidecar-бинарники (yt-dlp + ffmpeg)
        run: npm run fetch-binaries
        env:
          # На macOS собираем universal-сайдкары (lipo arm64 + x86_64).
          MESTIA_MAC_UNIVERSAL: ${{ matrix.platform == 'macos-latest' && '1' || '' }}

      # macOS собирается ad-hoc (signingIdentity "-" в tauri.conf.json) — работает
      # у пользователя после `xattr -cr` (см. README). Полноценная подпись +
      # нотаризация НАМЕРЕННО отключены: нужен платный Apple Developer ID. Чтобы
      # включить — заведите Apple-секреты и верните сюда шаг подмены signingIdentity
      # + блок APPLE_* env (история в git); тогда `xattr` пользователям не понадобится.
      - name: Сборка и релиз
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись апдейтера — приватный ключ и пароль из секретов репозитория.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mestia ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Для macOS — universal; на остальных пусто.
          args: ${{ matrix.args }}
          # Генерировать и прикладывать latest.json к релизу (нужно апдейтеру).
          includeUpdaterJson: true

      # ── Flatpak для Steam Deck / Linux ────────────────────────────────────────
      # Заворачиваем собранный .deb в Flatpak с рантаймом GNOME (внутри WebKitGTK),
      # чтобы приложение работало на SteamOS, где системного webkit2gtk нет.
      - name: Сборка Flatpak (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          cp src-tauri/target/release/bundle/deb/*.deb flatpak/mestia.deb
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo flatpak-build flatpak/com.mestia.app.yml
          # Имя с версией (из package.json), в стиле остальных артефактов.
          VERSION=$(node -p "require('./package.json').version")
          flatpak build-bundle repo "Mestia_${VERSION}_x86_64.flatpak" com.mestia.app \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Прикрепить Flatpak к релизу
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Mestia_*_x86_64.flatpak --clobber

  # ── Android (APK по архитектурам) ─────────────────────────────────────────────
  # Подписывается ключом из секретов ANDROID_KEYSTORE_BASE64 (base64 от .jks),
  # ANDROID_KEYSTORE_PASSWORD и ANDROID_KEY_ALIAS. Ключ должен быть всегда один и тот
  # же — иначе Android не даст обновить приложение поверх старой версии. Ждёт build:
  # draft-релиз создаёт tauri-action, сюда только докладываем APK.
  android:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Сторонние actions в этой ноге закреплены по SHA: рядом с ними лежит ключ подписи.
      - name: Rust (Android targets)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Кэш Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — APK не подписать (см. README → Android)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # NDK уже есть в образе ubuntu-latest (ANDROID_NDK_LATEST_HOME).
      - name: Сборка APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npm run tauri android build -- --apk --split-per-abi --target aarch64 --target armv7

      # Ключ не должен пережить сборку (post-шаги кэша и любые следующие шаги его не увидят).
      - name: Удалить ключ подписи
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties

      - name: Прикрепить APK к релизу
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          OUT=src-tauri/gen/android/app/build/outputs/apk
          cp "$OUT/arm64/release/app-arm64-release.apk" "Mestia_${VERSION}_android_arm64.apk"
          cp "$OUT/arm/release/app-arm-release.apk" "Mestia_${VERSION}_android_armv7.apk"
          gh release upload "${{ github.ref_name }}" Mestia_*_android_*.apk --clobber

  # ── Текст релиза ──────────────────────────────────────────────────────────────
  # Описание берётся из .github/release-notes.md (обновляется перед каждым тегом).
  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Описание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file .github/release-notes.md

  # ── Версионное имя updater-артефакта macOS ────────────────────────────────────
  # Tauri называет его без версии (Mestia_universal.app.tar.gz). Приводим к стилю
  # остальных ассетов (Mestia_<ver>_universal.app.tar.gz) и СИНХРОННО правим ссылку
  # в latest.json — иначе автообновление на macOS сломётся (404). Запускаем после
  # всех сборок, чтобы latest.json уже был полностью собран по всем платформам.
  rename-mac-updater:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Переименовать и поправить latest.json
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          OLD="Mestia_universal.app.tar.gz"
          NEW="Mestia_${VER}_universal.app.tar.gz"
          # Артефакта нет (mac-нога не собиралась) или уже переименован — выходим спокойно.
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fqx "$OLD"; then
            echo "::notice::$OLD не найден — пропускаю переименование."
            exit 0
          fi
          gh release download "$TAG" --pattern "$OLD" --pattern "$OLD.sig" --pattern "latest.json"
          mv "$OLD" "$NEW"
          mv "$OLD.sig" "$NEW.sig"
          # В latest.json правим только имя архива (подпись лежит inline, имя .sig не упоминается).
          sed -i "s/Mestia_universal\.app\.tar\.gz/${NEW}/g" latest.json
          gh release upload "$TAG" "$NEW" "$NEW.sig" latest.json --clobber
          gh release delete-asset "$TAG" "$OLD" -y
          gh release delete-asset "$TAG" "$OLD.sig" -y
          echo "::notice::Готово: $NEW + обновлён latest.json."
